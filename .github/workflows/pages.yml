name: Publish built browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified browser build
        env:
          DEMO_URL: 'https://github.com/kuboderahikaru/backrooms-web-demo/releases/download/demo-fb0b22af/Backrooms-WebDemo.zip'
        run: |
          curl --fail --location --retry 3 "$DEMO_URL" --output demo.zip
          echo '4231abfb6d95fbc58e0021082a708a8d6985af572a1f8dddeab78c9115f08d19  demo.zip' | sha256sum --check
          mkdir _site
          unzip -q demo.zip -d _site
          test -s _site/index.html
          test -s _site/Build/WebDemo.wasm.unityweb
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages-' + process.env.GITHUB_RUN_ATTEMPT;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              if (response.data.artifacts.filter(a => a.name === name && !a.expired).length === 1) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Uploaded Pages artifact metadata was not ready.');
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
